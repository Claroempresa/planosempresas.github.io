# Mantém o site da Evelyn e as páginas dos consultores sempre iguais.
# Fonte única: modelo/ (visual), fonte/ (planos e consultores), dados/ (benefícios, FAQ), css/ e js/.
# Quando qualquer um deles muda na main, os testes de cálculo rodam, as páginas são regeradas
# (index.html, everton/, kauan/, camily/...) e salvas de volta. Os links não mudam.
name: Atualizar o site e as páginas dos consultores

on:
  push:
    branches: [main]
    paths:
      - modelo/**
      - fonte/**
      - dados/beneficios.json
      - dados/faq.json
      - dados/depoimentos.json
      - css/**
      - js/**
      - scripts/**
      - tests/unidade.test.js
      - logos/**
      - icons/**
      - claro-revenda.png
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gerar-site
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testar as contas e o catálogo
        run: node --test tests/unidade.test.js
      - name: Gerar o site de todos os consultores
        run: python3 scripts/gerar.py
      - name: Salvar se algo mudou
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Atualiza o site e as páginas dos consultores"
            git push
          else
            echo "Nada mudou."
          fi
