# Mantém as páginas dos consultores iguais ao site oficial (index.html).
# Quando index.html, o gerador ou as imagens mudam na main, as pastas
# de cada consultor (everton/, kauan/, camily/...) são regeradas e
# salvas de volta. Os links não mudam.
name: Atualizar páginas dos consultores

on:
  push:
    branches: [main]
    paths:
      - index.html
      - gerar_consultores.py
      - logos/**
      - claro-revenda.png
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: consultores
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar páginas dos consultores
        run: python3 gerar_consultores.py
      - name: Salvar se algo mudou
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Atualiza páginas dos consultores a partir do site oficial"
            git push
          else
            echo "Nada mudou."
          fi
